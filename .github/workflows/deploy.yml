name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: resolveroom-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Validate, migrate, deploy, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.PUBLIC_APP_URL }}

    env:
      CI: 'true'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      JUDGE_PROVIDER: ${{ vars.JUDGE_PROVIDER || 'disabled' }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'console' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GITHUB_CLIENT_ID: ${{ secrets.RESOLVEROOM_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.RESOLVEROOM_GITHUB_CLIENT_SECRET }}
      JUDGE_API_URL: ${{ secrets.JUDGE_API_URL }}
      JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
      JUDGE_MODEL: ${{ secrets.JUDGE_MODEL }}
      EMAIL_API_URL: ${{ secrets.EMAIL_API_URL }}
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Validate production configuration
        run: npm run deploy:config

      - name: Run release gates
        run: |
          npm run check
          npm run test:e2e
          npm audit --audit-level=high

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.deploy.toml

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply resolveroom --remote --config wrangler.deploy.toml

      - name: Sync configured Worker secrets
        run: npm run deploy:secrets

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.125.0'
          packageManager: npm
          command: deploy --config wrangler.deploy.toml
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test production
        run: npm run deploy:smoke
